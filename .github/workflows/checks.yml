name: Checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Repo integrity — links resolve, everything reachable from README
        run: python scripts/check_repo.py
